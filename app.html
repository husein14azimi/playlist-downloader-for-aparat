<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playlist Downloader for Aparat</title>
  <script src="boot.js"></script>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Icons: Lucide (https://lucide.dev), ISC license, inlined as an SVG sprite. -->
<svg class="sprite" aria-hidden="true">
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-languages" viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></symbol>
</svg>

<main>
  <header>
    <h1 class="brand"><img src="icons/icon-32.png" width="32" height="32" alt=""><span data-i18n="app.title">Playlist Downloader for Aparat</span></h1>
    <div class="tools">
      <button id="lang" class="quiet round" type="button">
        <svg class="ic"><use href="#i-languages"/></svg>
        <span id="langBadge" class="badge">EN</span>
      </button>
      <button id="theme" class="quiet round" type="button">
        <svg class="ic i-sun"><use href="#i-sun"/></svg>
        <svg class="ic i-moon"><use href="#i-moon"/></svg>
      </button>
    </div>
  </header>

  <form id="loader" class="loader">
    <label for="url" class="sr-only" data-i18n="loader.label">Playlist link</label>
    <svg class="ic"><use href="#i-link"/></svg>
    <input id="url" type="text" inputmode="url" dir="ltr" autofocus placeholder="https://www.aparat.com/playlist/1301084/">
    <button id="load" type="submit" data-i18n="loader.load">Load playlist</button>
  </form>
  <p id="msg" role="status"></p>

  <section id="panel" hidden>
    <div class="pl">
      <img id="plThumb" alt="" referrerpolicy="no-referrer" hidden>
      <div>
        <h2 id="plTitle"></h2>
        <p id="plChannel"></p>
        <p id="plMeta"></p>
      </div>
    </div>

    <div class="bar">
      <label class="chip"><input id="all" type="checkbox" checked><span data-i18n="list.selectAll">Select all</span></label>
      <label class="chip"><span data-i18n="list.quality">Highest quality</span>
        <select id="q">
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
          <option value="240">240p</option>
          <option value="144">144p</option>
        </select>
      </label>
      <span class="spacer"></span>
      <button id="stop" class="quiet" type="button" hidden><svg class="ic"><use href="#i-stop"/></svg><span data-i18n="action.stop">Stop</span></button>
      <button id="go" type="button"><svg class="ic"><use href="#i-download"/></svg><span data-i18n="action.download">Download selected</span></button>
    </div>
    <div id="summary" class="counts" role="status">
      <span id="cSelected" class="count"><b></b><span data-i18n="summary.selected">selected</span></span>
      <span id="cDone" class="count"><b></b><span data-i18n="summary.done">done</span></span>
      <span id="cSkipped" class="count"><b></b><span data-i18n="summary.skipped">skipped</span></span>
      <span id="cFailed" class="count"><b></b><span data-i18n="summary.failed">failed</span></span>
    </div>
    <ol id="list"></ol>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
