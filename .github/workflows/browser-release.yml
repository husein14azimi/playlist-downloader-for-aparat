name: Publish browser builds

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'husein14azimi/playlist-downloader-for-aparat'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Run tests
        run: npm test
      - name: Build Firefox, Chrome and Edge packages
        run: npm run build
      - name: Create checksums
        working-directory: dist
        run: sha256sum playlist-downloader-aparat-*.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.repository == 'husein14azimi/playlist-downloader-for-aparat'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-packages
          path: packages
      - name: Verify packages
        working-directory: packages
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_SHA}"
          title="Browser build ${GITHUB_SHA:0:7}"
          notes="${RUNNER_TEMP}/browser-release-notes.md"
          cat > "$notes" <<EOF
          Automatic development build from main, commit ${GITHUB_SHA}.

          Includes Firefox, Chrome and Edge ZIPs and SHA-256 checksums.
          Extract the Chrome or Edge ZIP, enable Developer mode on the browser's extensions page, and use Load unpacked.
          Load the Firefox ZIP through about:debugging as a temporary add-on. This package is unsigned.
          These packages are for manual installation; browser-store publishing is separate.
          EOF
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease \
              --title "$title" --notes-file "$notes"
          fi
          gh release upload "$tag" packages/*.zip packages/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
